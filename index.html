<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HGB Person Index</title>
  <!-- persons_resolved.json is generated by build_data.py (approach 4) -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #faf9f7;
      --surface:  #ffffff;
      --border:   #e2ddd6;
      --accent:   #6b4f2a;
      --accent2:  #9e7a48;
      --text:     #2d2520;
      --muted:    #8a7968;
      --tag-bg:   #f0ebe3;
      --tag-border: #d4c9b8;
      --shadow:   0 1px 4px rgba(0,0,0,.08);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      font-size: 15px;
      line-height: 1.6;
    }

    #site-header {
      height: 56px; background: var(--accent); color: #fff;
      display: flex; align-items: center; padding: 0 20px; gap: 16px;
    }
    #logos { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    #logos img { height: 30px; width: auto; filter: brightness(0) invert(1); object-fit: contain; opacity: .9; }
    #logos img.logo-bern { height: 26px; }
    #site-title { font-size: .9rem; opacity: .7; white-space: nowrap; flex-shrink: 0; }
    #page-nav { display: flex; margin-left: auto; }
    .page-tab {
      padding: 0 14px; height: 56px; display: flex; align-items: center; text-decoration: none;
      font-size: .8rem; color: rgba(255,255,255,.65); border-bottom: 3px solid transparent;
      transition: color .15s, border-color .15s; white-space: nowrap;
    }
    .page-tab:hover { color: #fff; }
    .page-tab.active { color: #fff; border-bottom-color: rgba(255,255,255,.7); }

    .search-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: var(--shadow);
    }
    .search-bar input[type=text] {
      flex: 1 1 280px;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: .95rem;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    .search-bar input[type=text]:focus { border-color: var(--accent2); }
    .search-bar input[type=text]::placeholder { color: var(--muted); }

    .filters {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    }
    .filters label { font-size: .82rem; color: var(--muted); }
    .filters input[type=number] {
      width: 68px; padding: 6px 8px;
      border: 1px solid var(--border); border-radius: 4px;
      font-size: .82rem; font-family: inherit;
      background: var(--bg); color: var(--text);
    }
    .filters select {
      padding: 6px 10px;
      border: 1px solid var(--border); border-radius: 4px;
      font-size: .82rem; font-family: inherit;
      background: var(--bg); color: var(--text);
      max-width: 180px;
    }

    #status {
      padding: 10px 32px;
      font-size: .82rem;
      color: var(--muted);
      min-height: 34px;
      border-bottom: 1px solid var(--border);
    }

    #results {
      padding: 20px 32px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .card:hover { border-color: var(--accent2); box-shadow: 0 2px 8px rgba(0,0,0,.12); }

    .card-name {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .card-name mark {
      background: #f5e9c8;
      color: var(--accent);
      border-radius: 2px;
      padding: 0 1px;
    }
    .card-meta {
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: .74rem;
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      color: var(--text);
    }
    .tag .tag-label { color: var(--muted); margin-right: 2px; }
    .tag.deceased { background: #f8f0f0; border-color: #e8c8c8; color: #7a3a3a; }
    .tag.occ      { background: #eef4f0; border-color: #c4dac8; }
    .tag.title    { background: #f0eef8; border-color: #c8c4e0; }
    .tag.fam      { background: #f8f4ee; border-color: #e0d4c0; }
    .tag.org      { background: #eef0f8; border-color: #c4c8e0; }
    .tag.loc      { background: #f4f8ee; border-color: #ccdcc0; }

    /* Detail modal */
    #modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
      overflow-y: auto;
    }
    #modal-overlay.open { display: flex; }
    #modal {
      background: var(--surface);
      border-radius: 8px;
      padding: 32px;
      max-width: 640px;
      width: 100%;
      position: relative;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    #modal h2 { font-size: 1.4rem; color: var(--accent); margin-bottom: 4px; }
    #modal .modal-meta { font-size: .82rem; color: var(--muted); margin-bottom: 20px; }
    #modal-close {
      position: absolute; top: 16px; right: 18px;
      background: none; border: none; font-size: 1.4rem;
      cursor: pointer; color: var(--muted); line-height: 1;
    }
    #modal-close:hover { color: var(--text); }

    .modal-section { margin-bottom: 16px; }
    .modal-section h3 {
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }
.loading {
      text-align: center;
      padding: 80px 32px;
      color: var(--muted);
      font-style: italic;
      font-size: 1rem;
      grid-column: 1/-1;
    }
    .no-results {
      text-align: center;
      padding: 60px 32px;
      color: var(--muted);
      font-style: italic;
      grid-column: 1/-1;
    }

    .show-more-wrap {
      grid-column: 1/-1;
      text-align: center;
      padding: 10px;
    }
    .show-more-wrap button {
      padding: 8px 24px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: .88rem;
    }
    .show-more-wrap button:hover { background: var(--accent2); }
  </style>
</head>
<body>

<div id="site-header">
  <div id="logos">
    <img class="logo-bern" src="https://www.unibe.ch/assets/media/image/logo-uni-bern.svg" alt="Universität Bern" onerror="this.style.display='none'">
    <img src="https://www.unibas.ch/dam/jcr:93abfa0e-58d6-45ed-930a-de414ca40b13/uni-basel-logo.2018-03-26-12-26-39.svg" alt="Universität Basel" onerror="this.style.display='none'">
  </div>
  <span id="site-title">Historisches Grundbuch Basel</span>
  <nav id="page-nav">
    <a class="page-tab active" href="index.html">Personenindex</a>
    <a class="page-tab" href="map.html">Karte</a>
    <a class="page-tab" href="korrelationsanalyse.html">Korrelationsanalyse</a>
    <a class="page-tab" href="viz.html">Berufe</a>
    <a class="page-tab" href="movements.html">Personenbewegungen</a>
    <a class="page-tab" href="families.html">Familien</a>
    <a class="page-tab" href="tree.html">Stammbaum</a>
    <a class="page-tab" href="rollen.html">Rollen</a>
  </nav>
</div>

<div class="search-bar">
  <input type="text" id="q" placeholder="Search by name…" autocomplete="off" autofocus />
  <div class="filters">
    <label>Year</label>
    <input type="number" id="year-from" placeholder="from" min="1400" max="1700" />
    <input type="number" id="year-to"   placeholder="to"   min="1400" max="1700" />
    <label>Occupation</label>
    <select id="occ-filter"><option value="">— all —</option></select>
  </div>
</div>

<div id="status">Loading data…</div>
<div id="results"><div class="loading">Loading person index…</div></div>

<div id="modal-overlay">
  <div id="modal">
    <button id="modal-close" title="Close">×</button>
    <h2 id="modal-name"></h2>
    <div class="modal-meta" id="modal-meta"></div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
(function () {
  let data = [];
  let filtered = [];
  let page = 0;
  const PAGE = 50;

  const qEl         = document.getElementById('q');
  const yearFrom    = document.getElementById('year-from');
  const yearTo      = document.getElementById('year-to');
  const occFilter   = document.getElementById('occ-filter');
  const statusEl    = document.getElementById('status');
  const resultsEl   = document.getElementById('results');
  const overlay     = document.getElementById('modal-overlay');
  const modalName   = document.getElementById('modal-name');
  const modalMeta   = document.getElementById('modal-meta');
  const modalBody   = document.getElementById('modal-body');

  // ── Load data ──────────────────────────────────────────────
  fetch('persons_resolved.json')
    .then(r => r.json())
    .then(json => {
      data = json;
      buildOccFilter();
      applyUrlParams();
      render();
    })
    .catch(() => {
      statusEl.textContent = 'Error loading data.';
      resultsEl.innerHTML = '<div class="no-results">Could not load persons_index.json.</div>';
    });

  function buildOccFilter() {
    const counts = {};
    for (const r of data) {
      if (r.occ) for (const o of r.occ) counts[o] = (counts[o] || 0) + 1;
    }
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    for (const [occ, cnt] of sorted) {
      const opt = document.createElement('option');
      opt.value = occ;
      opt.textContent = `${occ} (${cnt})`;
      occFilter.appendChild(opt);
    }
  }

  // Pre-fill search from URL (?q=Name) so deep links from other pages filter.
  function applyUrlParams() {
    const params = new URLSearchParams(location.search);
    const q = params.get('q');
    if (q) qEl.value = q;
  }

  // ── Filtering ──────────────────────────────────────────────
  function applyFilters() {
    const q    = qEl.value.trim().toLowerCase();
    const from = yearFrom.value ? parseInt(yearFrom.value) : 0;
    const to   = yearTo.value   ? parseInt(yearTo.value)   : 9999;
    const occ  = occFilter.value;

    filtered = data.filter(r => {
      if (q && !r.n.toLowerCase().includes(q)) return false;
      if (r.y[1] < from || r.y[0] > to) return false;
      if (occ && !(r.occ && r.occ.includes(occ))) return false;
      return true;
    });

    // Sort: exact prefix matches first, then by mention count
    if (q) {
      filtered.sort((a, b) => {
        const ap = a.n.toLowerCase().startsWith(q);
        const bp = b.n.toLowerCase().startsWith(q);
        if (ap && !bp) return -1;
        if (!ap && bp) return 1;
        return b.c - a.c;
      });
    } else {
      filtered.sort((a, b) => b.c - a.c);
    }

    page = 0;
    renderResults();
  }

  function highlight(text, q) {
    if (!q) return escHtml(text);
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return escHtml(text);
    return escHtml(text.slice(0, i)) +
           '<mark>' + escHtml(text.slice(i, i + q.length)) + '</mark>' +
           escHtml(text.slice(i + q.length));
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Rendering ─────────────────────────────────────────────
  function renderResults() {
    const q = qEl.value.trim().toLowerCase();
    statusEl.textContent =
      filtered.length === 0 ? 'No results.' :
      filtered.length === data.length
        ? `${data.length.toLocaleString()} persons total — type to search`
        : `${filtered.length.toLocaleString()} result${filtered.length !== 1 ? 's' : ''}`;

    const slice = filtered.slice(0, (page + 1) * PAGE);
    const html = [];

    if (slice.length === 0) {
      html.push('<div class="no-results">No persons found.</div>');
    } else {
      for (const r of slice) {
        html.push(cardHtml(r, q));
      }
      if (filtered.length > slice.length) {
        html.push(`<div class="show-more-wrap">
          <button id="show-more">Show more (${filtered.length - slice.length} remaining)</button>
        </div>`);
      }
    }

    resultsEl.innerHTML = html.join('');

    document.querySelectorAll('.card').forEach(el => {
      el.addEventListener('click', () => openModal(data.find(r => r.n === el.dataset.name)));
    });
    const showMore = document.getElementById('show-more');
    if (showMore) showMore.addEventListener('click', () => { page++; renderResults(); });
  }

  function cardHtml(r, q) {
    const yearStr = r.y[0] === r.y[1] ? r.y[0] : `${r.y[0]}–${r.y[1]}`;
    const dossierStr = r.d > 1 ? ` · ${r.d} dossiers` : '';
    let tags = '';

    if (r.dead) tags += `<span class="tag deceased">† deceased ×${r.dead}</span>`;
    if (r.occ)  tags += r.occ.slice(0,3).map(o =>
      `<span class="tag occ"><span class="tag-label">occ</span>${escHtml(o)}</span>`).join('');
    if (r.tit)  tags += r.tit.slice(0,2).map(t =>
      `<span class="tag title"><span class="tag-label">title</span>${escHtml(t)}</span>`).join('');
    if (r.fam)  tags += r.fam.slice(0,2).map(f =>
      `<span class="tag fam"><span class="tag-label">kin</span>${escHtml(f)}</span>`).join('');
    if (r.org)  tags += r.org.slice(0,1).map(o =>
      `<span class="tag org"><span class="tag-label">org</span>${escHtml(o)}</span>`).join('');
    if (r.loc)  tags += r.loc.slice(0,1).map(l =>
      `<span class="tag loc"><span class="tag-label">loc</span>${escHtml(l)}</span>`).join('');

    return `<div class="card" data-name="${escHtml(r.n).replace(/"/g,'&quot;')}">
      <div class="card-name">${highlight(r.n, q)}</div>
      <div class="card-meta">${r.c} mention${r.c !== 1 ? 's' : ''} · ${yearStr}${dossierStr}</div>
      ${tags ? `<div class="card-tags">${tags}</div>` : ''}
    </div>`;
  }

  // ── Modal ─────────────────────────────────────────────────
  function openModal(r) {
    if (!r) return;
    const yearStr = r.y[0] === r.y[1] ? r.y[0] : `${r.y[0]}–${r.y[1]}`;
    modalName.textContent = r.n;
    modalMeta.textContent = `${r.c} mention${r.c !== 1 ? 's' : ''} · ${yearStr}`;

    const sections = [];

    if (r.v && r.v.length > 1) {
      const variants = r.v.filter(v => v !== r.n).slice(0, 20);
      if (variants.length) {
        sections.push(section('Name variants',
          variants.map(v => `<span class="tag">${escHtml(v)}</span> `).join('')));
      }
    }
    if (r.occ && r.occ.length) {
      sections.push(section('Occupations', r.occ.map(o => tag('occ', o)).join('')));
    }
    if (r.tit)  sections.push(section('Titles',            r.tit.map(t => tag('title', t)).join('')));
    if (r.fam)  sections.push(section('Family relations',  r.fam.map(f => tag('fam', f)).join('')));
    if (r.org)  sections.push(section('Org. affiliations', r.org.map(o => tag('org', o)).join('')));
    if (r.loc)  sections.push(section('Locations',         r.loc.map(l => tag('loc', l)).join('')));
    if (r.dead) sections.push(section('Deceased', `<span class="tag deceased">marked deceased in ${r.dead} mention${r.dead !== 1 ? 's' : ''}</span>`));

    modalBody.innerHTML = sections.join('');
    overlay.classList.add('open');
  }

  function section(title, content) {
    return `<div class="modal-section"><h3>${title}</h3>${content}</div>`;
  }
  function tag(cls, text) {
    return `<span class="tag ${cls}">${escHtml(text)}</span> `;
  }

  document.getElementById('modal-close').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

  // ── Events ────────────────────────────────────────────────
  let debounce;
  function scheduleRender() {
    clearTimeout(debounce);
    debounce = setTimeout(applyFilters, 180);
  }

  qEl.addEventListener('input', scheduleRender);
  yearFrom.addEventListener('input', scheduleRender);
  yearTo.addEventListener('input', scheduleRender);
  occFilter.addEventListener('change', applyFilters);

  function render() { applyFilters(); }
})();
</script>
</body>
</html>
