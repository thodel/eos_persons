<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rollen — Historisches Grundbuch Basel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f7; --surface: #ffffff; --border: #e2ddd6;
      --accent: #6b4f2a; --accent2: #9e7a48; --text: #2d2520; --muted: #8a7968;
    }
    html, body { height: 100%; font-family: 'Georgia', serif; font-size: 14px; color: var(--text); }

    #site-header {
      height: 56px; background: var(--accent); color: #fff;
      display: flex; align-items: center; padding: 0 20px; gap: 16px; z-index: 1000; position: relative;
    }
    #logos { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    #logos img { height: 30px; width: auto; filter: brightness(0) invert(1); object-fit: contain; opacity: .9; }
    #logos img.logo-bern { height: 26px; }
    #site-title { font-size: .9rem; opacity: .7; white-space: nowrap; flex-shrink: 0; }
    #page-nav { display: flex; margin-left: auto; overflow-x: auto; }
    .page-tab {
      padding: 0 14px; height: 56px; display: flex; align-items: center; text-decoration: none;
      font-size: .8rem; color: rgba(255,255,255,.65); border-bottom: 3px solid transparent; white-space: nowrap;
    }
    .page-tab:hover { color: #fff; }
    .page-tab.active { color: #fff; border-bottom-color: rgba(255,255,255,.7); }

    #layout { display: flex; height: calc(100vh - 56px); }

    /* ── Sidebar with category groups + position sub-tabs ── */
    #sidebar {
      width: 290px; flex-shrink: 0; background: var(--bg);
      border-right: 1px solid var(--border); overflow-y: auto;
    }
    .cat-group { border-bottom: 1px solid var(--border); }
    .cat-head {
      padding: 11px 16px 6px; font-size: .72rem; text-transform: uppercase;
      letter-spacing: .07em; color: var(--accent); font-weight: bold;
    }
    .role-tab {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 7px 16px 7px 22px; cursor: pointer; font-size: .85rem; gap: 8px;
    }
    .role-tab:hover { background: #f0ebe3; }
    .role-tab.active { background: #efe7db; border-left: 3px solid var(--accent); padding-left: 19px; }
    .role-tab .cnt { color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }

    /* ── Main panel ── */
    #main { flex: 1; overflow-y: auto; padding: 26px 30px; }
    #main h1 { font-size: 1.4rem; font-weight: normal; color: var(--accent); margin-bottom: 4px; }
    #main .sub { color: var(--muted); font-size: .85rem; margin-bottom: 18px; }
    .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar input {
      padding: 6px 10px; border: 1px solid var(--border); border-radius: 5px;
      font-size: .85rem; font-family: inherit; min-width: 220px;
    }
    .toolbar .sortbtn {
      font-size: .78rem; color: var(--accent2); background: none; border: 1px solid var(--border);
      border-radius: 5px; padding: 5px 10px; cursor: pointer; font-family: inherit;
    }
    .toolbar .sortbtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    #count { margin-left: auto; color: var(--muted); font-size: .8rem; }

    .person-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px;
    }
    .pcard {
      border: 1px solid var(--border); border-radius: 6px; background: var(--surface);
      padding: 9px 12px; text-decoration: none; color: inherit; display: block;
      transition: border-color .12s, box-shadow .12s;
    }
    .pcard:hover { border-color: var(--accent2); box-shadow: 0 1px 5px rgba(0,0,0,.06); }
    .pcard .nm { font-weight: bold; color: var(--accent); }
    .pcard .meta { color: var(--muted); font-size: .76rem; margin-top: 2px; }
    .occ-tag { display: inline-block; background: #eef4f0; border: 1px solid #c4dac8;
      border-radius: 9px; padding: 1px 7px; font-size: .7rem; margin-top: 5px; }
    .toolbar select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 5px;
      font-size: .82rem; font-family: inherit; background: #fff; }
    #intro { color: var(--muted); font-style: italic; padding: 40px 0; }
    #loading { text-align: center; padding: 80px; color: var(--muted); font-style: italic; }
  </style>
</head>
<body>

<div id="site-header">
  <div id="logos">
    <img class="logo-bern" src="https://www.unibe.ch/assets/media/image/logo-uni-bern.svg" alt="Universität Bern" onerror="this.style.display='none'">
    <img src="https://www.unibas.ch/dam/jcr:93abfa0e-58d6-45ed-930a-de414ca40b13/uni-basel-logo.2018-03-26-12-26-39.svg" alt="Universität Basel" onerror="this.style.display='none'">
  </div>
  <span id="site-title">Historisches Grundbuch Basel</span>
  <nav id="page-nav">
    <a class="page-tab" href="index.html">Personenindex</a>
    <a class="page-tab" href="map.html">Karte</a>
    <a class="page-tab" href="korrelationsanalyse.html">Korrelationsanalyse</a>
    <a class="page-tab" href="viz.html">Berufe</a>
    <a class="page-tab" href="movements.html">Personenbewegungen</a>
    <a class="page-tab" href="bewegungsfeld.html">Bewegungsfeld</a>
    <a class="page-tab" href="families.html">Familien</a>
    <a class="page-tab" href="tree.html">Stammbaum</a>
    <a class="page-tab active" href="rollen.html">Rollen</a>
    <a class="page-tab" href="hbls.html">HBLS</a>
  </nav>
</div>

<div id="layout">
  <div id="sidebar"><div id="loading">Lade…</div></div>
  <div id="main">
    <div id="intro">Wähle links eine Position, um die Personen anzuzeigen, die sie
      im Historischen Grundbuch innehatten.</div>
  </div>
</div>

<script>
let DATA = null;
let current = null;
let sortMode = "year";   // "year" | "name" | "mentions"
let guildFilter = "";    // active inferred-guild filter (Zunftmeister)

fetch("roles_data.json")
  .then(r => r.json())
  .then(data => {
    DATA = data;
    buildSidebar();
    const params = new URLSearchParams(location.search);
    const r = params.get("r");
    selectRole(r && DATA.positions.find(p => p.id === r) ? r : DATA.positions[0].id);
  });

function buildSidebar() {
  const byCat = {};
  DATA.positions.forEach(p => (byCat[p.cat] ||= []).push(p));
  const html = DATA.categories.map(c => {
    const items = (byCat[c.id] || []).map(p => `
      <div class="role-tab" data-id="${p.id}">
        <span>${p.label}</span><span class="cnt">${p.count.toLocaleString("de-CH")}</span>
      </div>`).join("");
    return `<div class="cat-group"><div class="cat-head">${c.label}</div>${items}</div>`;
  }).join("");
  document.getElementById("sidebar").innerHTML = html;
  document.querySelectorAll(".role-tab").forEach(el =>
    el.addEventListener("click", () => selectRole(el.dataset.id)));
}

function selectRole(id) {
  current = DATA.positions.find(p => p.id === id);
  guildFilter = "";   // reset guild filter when switching role
  document.querySelectorAll(".role-tab").forEach(el =>
    el.classList.toggle("active", el.dataset.id === id));
  history.replaceState(null, "", `?r=${id}`);
  renderMain();
}

function renderMain() {
  const p = current;
  const span = p.year_min ? `${p.year_min}–${p.year_max}` : "—";

  // guild filter (only for Zunftmeister-type positions, where guild is inferred)
  let guildHtml = "";
  if (p.guilds && p.guilds.length) {
    const opts = ['<option value="">alle Zünfte</option>']
      .concat(p.guilds.map(g =>
        `<option value="${g.guild}">${g.guild} (${g.count})</option>`));
    guildHtml = `<select id="guildSel" title="Zunft (aus Beruf erschlossen)">${opts.join("")}</select>`;
  }

  document.getElementById("main").innerHTML = `
    <h1>${p.label}</h1>
    <div class="sub">${p.count.toLocaleString("de-CH")} Personen · belegt ${span}</div>
    ${p.guilds ? `<div class="sub" style="margin-top:-12px">Die Zunft ist nur dort bekannt,
       wo zugleich ein zünftiger Beruf überliefert ist – sonst „unbekannt“ (aus dem
       Beruf erschlossen, nicht direkt annotiert).</div>` : ""}
    <div class="toolbar">
      <input type="text" id="q" placeholder="Person filtern…" autocomplete="off" />
      ${guildHtml}
      <button class="sortbtn" data-s="year">nach Jahr</button>
      <button class="sortbtn" data-s="name">nach Name</button>
      <button class="sortbtn" data-s="mentions">nach Erwähnungen</button>
      <span id="count"></span>
    </div>
    <div class="person-grid" id="grid"></div>`;
  document.querySelectorAll(".sortbtn").forEach(b => {
    b.classList.toggle("active", b.dataset.s === sortMode);
    b.addEventListener("click", () => { sortMode = b.dataset.s; renderMain(); });
  });
  const gsel = document.getElementById("guildSel");
  if (gsel) {
    gsel.value = guildFilter;
    gsel.addEventListener("change", () => { guildFilter = gsel.value; renderGrid(); });
  }
  const qel = document.getElementById("q");
  let deb;
  qel.addEventListener("input", () => { clearTimeout(deb); deb = setTimeout(renderGrid, 150); });
  renderGrid();
}

function renderGrid() {
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  let rows = current.persons.filter(r =>
    (!q || r.n.toLowerCase().includes(q)) &&
    (!guildFilter || r.g === guildFilter));
  rows = rows.slice().sort((a, b) => {
    if (sortMode === "name") return a.n.localeCompare(b.n, "de");
    if (sortMode === "mentions") return (b.c || 0) - (a.c || 0);
    const ay = a.y ? a.y[0] : 9999, by = b.y ? b.y[0] : 9999;
    return ay - by || a.n.localeCompare(b.n, "de");
  });
  document.getElementById("count").textContent =
    `${rows.length.toLocaleString("de-CH")} Personen`;
  document.getElementById("grid").innerHTML = rows.slice(0, 800).map(r => {
    const yr = r.y ? (r.y[0] === r.y[1] ? r.y[0] : `${r.y[0]}–${r.y[1]}`) : "?";
    const guildTag = (r.g && r.g !== "unbekannt")
      ? `<span class="occ-tag" style="background:#f0eef8;border-color:#c8c4e0">Zunft: ${r.g}</span>` : "";
    return `<a class="pcard" href="index.html?q=${encodeURIComponent(r.n)}" target="_blank">
      <div class="nm">${r.n}</div>
      <div class="meta">${yr} · ${r.c} Erwähnung${r.c === 1 ? "" : "en"}</div>
      ${guildTag}
    </a>`;
  }).join("") + (rows.length > 800
    ? `<div style="color:var(--muted);font-size:.8rem;padding:8px">… ${rows.length - 800} weitere (zum Eingrenzen filtern)</div>`
    : "");
}
</script>
</body>
</html>
