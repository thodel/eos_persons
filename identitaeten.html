<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Identitäten – korpusübergreifend verknüpfte Personen</title>
  <!-- persons_web.json is generated by make_persons_web.py from merged_persons.json -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f7; --surface: #ffffff; --border: #e2ddd6; --accent: #6b4f2a;
      --accent2: #9e7a48; --text: #2d2520; --muted: #8a7968; --tag-bg: #f0ebe3;
      --tag-border: #d4c9b8; --shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    body { background: var(--bg); color: var(--text); font-family: 'Georgia', serif; font-size: 15px; line-height: 1.6; }
    #site-header { min-height: 56px; background: var(--accent); color: #fff; display: flex; align-items: center; padding: 0 20px; gap: 16px; }
    #logos { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    #logos img { height: 30px; width: auto; filter: brightness(0) invert(1); object-fit: contain; opacity: .9; }
    #logos img.logo-bern { height: 26px; }
    #site-title { font-size: .9rem; opacity: .7; white-space: nowrap; flex-shrink: 0; }
    #page-nav { display: flex; margin-left: auto; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; }
    .page-tab { padding: 0 14px; height: 56px; display: flex; align-items: center; text-decoration: none; font-size: .8rem; color: rgba(255,255,255,.65); border-bottom: 3px solid transparent; transition: color .15s, border-color .15s; white-space: nowrap; }
    .page-tab:hover { color: #fff; }
    .page-tab.active { color: #fff; border-bottom-color: rgba(255,255,255,.7); }

    .search-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 18px 32px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; box-shadow: var(--shadow); }
    #q { flex: 1; min-width: 240px; padding: 10px 14px; font-size: 1rem; font-family: inherit; border: 1px solid var(--tag-border); border-radius: 6px; background: var(--bg); color: var(--text); }
    #q:focus { outline: none; border-color: var(--accent2); }
    .stat { font-size: .8rem; color: var(--muted); white-space: nowrap; }
    #filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 32px; background: var(--surface); border-bottom: 1px solid var(--border); align-items: center; }
    #filters .f { font-size: .78rem; padding: 3px 10px; border-radius: 12px; border: 1px solid var(--tag-border); color: var(--accent2); cursor: pointer; background: transparent; font-family: inherit; }
    #filters .f:hover { background: var(--tag-bg); }
    #filters .f.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    #alpha { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 32px; background: var(--surface); border-bottom: 1px solid var(--border); }
    #alpha a { font-size: .78rem; padding: 2px 7px; border-radius: 4px; color: var(--accent2); text-decoration: none; cursor: pointer; }
    #alpha a:hover, #alpha a.on { background: var(--tag-bg); color: var(--accent); }

    main { max-width: 880px; margin: 0 auto; padding: 24px 20px 80px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 16px 20px; margin-bottom: 14px; }
    .card h2 { font-size: 1.15rem; color: var(--accent); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .card h2 .yr { font-size: .85rem; color: var(--accent2); font-weight: normal; }
    .corpora { display: flex; gap: 4px; margin-left: auto; }
    .corpus { font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; background: var(--tag-bg); border: 1px solid var(--tag-border); color: var(--accent2); }
    .corpus.hbls { background: #efe6d5; }
    .corpus.hls  { background: #e2ebe4; }
    .corpus.hgb  { background: #e6e2ef; }
    .row { margin-top: 8px; font-size: .88rem; display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
    .row .lbl { color: var(--muted); font-size: .78rem; min-width: 76px; }
    .chip { font-size: .8rem; padding: 1px 8px; border-radius: 11px; background: var(--tag-bg); border: 1px solid var(--tag-border); }
    .snip { margin-top: 8px; color: var(--text); font-size: .9rem; }
    .pubs { margin-top: 6px; font-size: .82rem; color: var(--text); }
    .pubs li { margin-left: 18px; }
    .sources { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--tag-border); display: flex; flex-wrap: wrap; gap: 10px; }
    .sources a, .sources span { font-size: .78rem; color: var(--accent2); text-decoration: none; }
    .sources a:hover { text-decoration: underline; }
    .sources span { color: var(--muted); }
    mark { background: #f3e6c8; padding: 0 1px; }
    #more { display: block; margin: 20px auto; padding: 10px 24px; font-family: inherit; font-size: .9rem; background: var(--accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    #intro { color: var(--muted); font-size: .85rem; margin-bottom: 16px; }
  </style>
</head>
<body>
<div id="site-header">
  <div id="logos">
    <img class="logo-bern" src="https://www.unibe.ch/assets/media/image/logo-uni-bern.svg" alt="Universität Bern" onerror="this.style.display='none'">
    <img src="https://www.unibas.ch/dam/jcr:93abfa0e-58d6-45ed-930a-de414ca40b13/uni-basel-logo.2018-03-26-12-26-39.svg" alt="Universität Basel" onerror="this.style.display='none'">
  </div>
  <span id="site-title">Historisches Grundbuch Basel</span>
  <nav id="page-nav">
    <a class="page-tab" href="index.html">Personenindex</a>
    <a class="page-tab" href="map.html">Karte</a>
    <a class="page-tab" href="korrelationsanalyse.html">Korrelationsanalyse</a>
    <a class="page-tab" href="viz.html">Berufe</a>
    <a class="page-tab" href="movements.html">Personenbewegungen</a>
    <a class="page-tab" href="bewegungsfeld.html">Bewegungsfeld</a>
    <a class="page-tab" href="preiskarte.html">Preiskarte</a>
    <a class="page-tab" href="families.html">Familien</a>
    <a class="page-tab" href="tree.html">Stammbaum</a>
    <a class="page-tab" href="rollen.html">Rollen</a>
    <a class="page-tab" href="hbls.html">HBLS</a>
    <a class="page-tab active" href="identitaeten.html">Identitäten</a>
  </nav>
</div>

<div class="search-bar">
  <input id="q" type="search" placeholder="Name, Beruf, Ort oder Werk suchen … (z. B. Buchdrucker, Zwinger, Basel)" autocomplete="off" />
  <span class="stat" id="stat">lädt …</span>
</div>
<div id="filters">
  <button class="f on" data-f="">Alle</button>
  <button class="f" data-f="tri">Alle drei Korpora</button>
  <button class="f" data-f="gnd">mit GND</button>
  <button class="f" data-f="pub">mit Publikationen</button>
  <button class="f" data-f="occ">mit Beruf</button>
  <button class="f" data-f="hgb">im Grundbuch belegt</button>
</div>
<div id="alpha"></div>

<main>
  <p id="intro"></p>
  <div id="results"></div>
  <button id="more" style="display:none">weitere anzeigen</button>
</main>

<script>
const PAGE = 60;
const CORPUS_LABEL = { hbls: "HBLS", hls: "HLS", hgb: "HGB" };
const AUTH_LABEL = { gnd: "GND", wd: "Wikidata", viaf: "VIAF", db: "Deutsche Biographie", isni: "ISNI" };
let DATA = [], view = [], shown = 0, letter = "", term = "", filter = "";
const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function hl(text, t) {
  if (!t) return esc(text);
  const i = text.toLowerCase().indexOf(t);
  if (i < 0) return esc(text);
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i,i+t.length)) + "</mark>" + esc(text.slice(i+t.length));
}

function years(r) {
  if (!r.b && !r.d) return "";
  return `<span class="yr">${r.b||"?"}–${r.d||"?"}</span>`;
}

function chips(label, items) {
  if (!items || !items.length) return "";
  return `<div class="row"><span class="lbl">${label}</span>` +
    items.map(x => `<span class="chip">${hl(x, term)}</span>`).join("") + `</div>`;
}

function card(r) {
  const badges = r.c.map(c => `<span class="corpus ${c}">${CORPUS_LABEL[c]||c}</span>`).join("");
  // gnd/wd are already listed (with their ids) among the sources below
  const auth = Object.entries(r.a).filter(([k]) => k !== "gnd" && k !== "wd").map(([k, v]) =>
      v.startsWith("http") ? `<a href="${esc(v)}" target="_blank" rel="noopener">${AUTH_LABEL[k]||k} ↗</a>`
                           : `<span>${AUTH_LABEL[k]||k}</span>`).join("");
  const src = r.s.map(s => s.u
      ? `<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.l)} ↗</a>`
      : `<span>${esc(s.l)}</span>`).join("");
  const pubs = r.pt.length
    ? `<div class="pubs"><span class="lbl">Werke (${r.np})</span><ul>` +
      r.pt.map(t => `<li>${hl(t, term)}</li>`).join("") + `</ul></div>`
    : "";
  return `<div class="card">
    <h2>${hl(r.n, term)} ${years(r)}<span class="corpora">${badges}</span></h2>
    ${chips("Beruf", r.o)}
    ${chips("Orte", r.pl)}
    ${r.sn ? `<div class="snip">${hl(r.sn, term)}</div>` : ""}
    ${pubs}
    <div class="sources">${src}${auth}</div>
  </div>`;
}

function matches(r, t) {
  if (r.n.toLowerCase().includes(t)) return true;
  if (r.o.some(o => o.toLowerCase().includes(t))) return true;
  if (r.pl.some(p => p.toLowerCase().includes(t))) return true;
  if (r.pt.some(p => p.toLowerCase().includes(t))) return true;
  return (r.sn||"").toLowerCase().includes(t);
}

function passesFilter(r) {
  switch (filter) {
    case "tri": return r.c.length === 3;
    case "gnd": return "gnd" in r.a;
    case "pub": return r.np > 0;
    case "occ": return r.o.length > 0;
    case "hgb": return r.c.includes("hgb");
    default: return true;
  }
}

function applyFilter() {
  const t = term;
  view = DATA.filter(r => {
    if (letter && (r.n[0]||"").toUpperCase() !== letter) return false;
    if (!passesFilter(r)) return false;
    return !t || matches(r, t);
  });
  if (t) {
    const score = r => {
      const n = r.n.toLowerCase();
      if (n === t) return 0;
      if (n.startsWith(t)) return 1;
      if (n.includes(t)) return 2;
      return 3;
    };
    view.sort((a, b) => score(a) - score(b) || a.n.localeCompare(b.n, "de"));
  }
  shown = 0;
  $("#results").innerHTML = "";
  renderMore();
  $("#stat").textContent = view.length.toLocaleString("de-CH") + " Personen";
}

function renderMore() {
  const slice = view.slice(shown, shown + PAGE);
  $("#results").insertAdjacentHTML("beforeend", slice.map(card).join(""));
  shown += slice.length;
  $("#more").style.display = shown < view.length ? "block" : "none";
}

function buildAlpha() {
  const letters = [...new Set(DATA.map(r => (r.n[0]||"").toUpperCase()))].filter(c=>/[A-ZÄÖÜÆŒ]/.test(c)).sort();
  $("#alpha").innerHTML = `<a data-l="" class="on">Alle</a>` + letters.map(c => `<a data-l="${c}">${c}</a>`).join("");
  $("#alpha").addEventListener("click", e => {
    if (e.target.tagName !== "A") return;
    letter = e.target.dataset.l;
    document.querySelectorAll("#alpha a").forEach(a => a.classList.toggle("on", a.dataset.l === letter));
    applyFilter();
    window.scrollTo(0,0);
  });
}

$("#filters").addEventListener("click", e => {
  if (!e.target.classList.contains("f")) return;
  filter = e.target.dataset.f;
  document.querySelectorAll("#filters .f").forEach(b => b.classList.toggle("on", b.dataset.f === filter));
  applyFilter();
  window.scrollTo(0,0);
});

let timer;
$("#q").addEventListener("input", e => {
  clearTimeout(timer);
  timer = setTimeout(() => { term = e.target.value.trim().toLowerCase(); applyFilter(); }, 180);
});
$("#more").addEventListener("click", renderMore);

fetch("persons_web.json").then(r => r.json()).then(d => {
  DATA = d;
  const tri = d.filter(r => r.c.length === 3).length;
  const gnd = d.filter(r => "gnd" in r.a).length;
  $("#intro").innerHTML = `<strong>${d.length.toLocaleString("de-CH")}</strong> korpusübergreifend verknüpfte Personen — je ein Datensatz pro identifizierter Person, zusammengeführt aus HBLS, HLS und dem Historischen Grundbuch Basel und über GND/Wikidata abgeglichen. <strong>${gnd.toLocaleString("de-CH")}</strong> tragen eine GND-Nummer, <strong>${tri}</strong> sind in allen drei Korpora belegt. Jeder Eintrag verweist auf seine Quellen zurück.`;
  buildAlpha();
  applyFilter();
}).catch(e => { $("#stat").textContent = "Fehler beim Laden"; console.error(e); });
</script>
</body>
</html>
