<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personenbewegungen — HGB Basel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f7; --surface: #fff; --border: #e2ddd6;
      --accent: #6b4f2a; --accent2: #9e7a48; --text: #2d2520; --muted: #8a7968;
      --header-h: 56px; --tabs-h: 38px;
    }
    html, body { height: 100%; font-family: 'Georgia', serif; font-size: 14px; color: var(--text); background: var(--bg); }

    /* ── Site header ─────────────────────────────────────────────────────────── */
    #site-header {
      height: var(--header-h); background: var(--accent); color: #fff;
      display: flex; align-items: center; padding: 0 20px; gap: 16px;
      position: relative; z-index: 1100;
    }
    #logos { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    #logos img {
      height: 32px; width: auto; filter: brightness(0) invert(1);
      object-fit: contain; opacity: .92;
    }
    #logos img.logo-bern { height: 28px; }
    #site-title {
      font-size: .95rem; letter-spacing: .03em; opacity: .75;
      white-space: nowrap; flex-shrink: 0;
    }
    #page-nav { display: flex; gap: 0; margin-left: auto; }
    .page-tab {
      padding: 0 16px; height: var(--header-h); display: flex; align-items: center;
      text-decoration: none; font-size: .8rem; color: rgba(255,255,255,.65);
      border-bottom: 3px solid transparent; transition: color .15s, border-color .15s;
      white-space: nowrap;
    }
    .page-tab:hover { color: #fff; }
    .page-tab.active { color: #fff; border-bottom-color: rgba(255,255,255,.7); }

    /* ── Mode tabs (within page) ─────────────────────────────────────────────── */
    #mode-tabs {
      height: var(--tabs-h); background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: stretch; padding: 0 16px; gap: 0;
      position: relative; z-index: 1000;
    }
    .mode-tab {
      padding: 0 18px; font-size: .82rem; font-family: inherit; border: none;
      background: none; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent;
      transition: color .15s, border-color .15s; white-space: nowrap;
    }
    .mode-tab:hover { color: var(--text); }
    .mode-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Layout ──────────────────────────────────────────────────────────────── */
    #layout {
      display: flex;
      height: calc(100vh - var(--header-h) - var(--tabs-h));
    }

    /* ── Sidebar ─────────────────────────────────────────────────────────────── */
    #sidebar {
      width: 300px; flex-shrink: 0; background: var(--bg);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* Drop zone */
    #data-status {
      margin: 10px 14px 4px; padding: 8px 12px; background: #f5ede0;
      border: 1px solid var(--border); border-radius: 4px;
      font-size: .78rem; color: var(--accent); flex-shrink: 0;
    }

    /* Panel containers */
    #panel-search, #panel-heatmap {
      display: flex; flex-direction: column; gap: 10px;
      padding: 0 14px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }

    label.ctrl-label {
      font-size: .7rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: .06em; display: block; margin-bottom: 2px;
    }
    select, input[type=text] {
      width: 100%; padding: 5px 8px; border: 1px solid var(--border);
      border-radius: 4px; background: #fff; font-size: .82rem; font-family: inherit;
    }

    /* ── Person search ───────────────────────────────────────────────────────── */
    #search-wrap { position: relative; }
    #person-search { padding-right: 28px; }
    #search-results {
      display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 500;
      background: #fff; border: 1px solid var(--border); border-top: none;
      border-radius: 0 0 4px 4px; max-height: 180px; overflow-y: auto;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }
    #search-results.open { display: block; }
    .result-item {
      padding: 6px 10px; cursor: pointer; font-size: .82rem;
      border-bottom: 1px solid var(--border);
    }
    .result-item:last-child { border-bottom: none; }
    .result-item:hover { background: #f5ede0; }
    .result-item.disabled { opacity: .4; cursor: default; }
    .result-id { font-size: .7rem; color: var(--muted); }

    /* Chips */
    #chips { display: flex; flex-wrap: wrap; gap: 5px; min-height: 0; }
    .chip {
      display: flex; align-items: center; gap: 5px; padding: 3px 8px;
      border-radius: 12px; font-size: .75rem; color: #fff; cursor: default;
    }
    .chip-remove {
      cursor: pointer; opacity: .7; font-size: .8rem; line-height: 1;
      background: none; border: none; color: inherit; padding: 0;
    }
    .chip-remove:hover { opacity: 1; }
    #chip-hint { font-size: .72rem; color: var(--muted); font-style: italic; }

    /* ── Heatmap controls ────────────────────────────────────────────────────── */
    #view-toggle { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .view-btn {
      flex: 1; padding: 5px 4px; font-size: .75rem; font-family: inherit;
      border: none; background: #fff; cursor: pointer; color: var(--muted); transition: background .15s;
      text-align: center;
    }
    .view-btn.active { background: var(--accent); color: #fff; }

    .slider-row { display: flex; flex-direction: column; gap: 2px; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .range-labels { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); }
    #window-label, #heat-window-label { font-size: .82rem; font-weight: bold; color: var(--text); }

    /* Animate row */
    .anim-row { display: flex; gap: 6px; align-items: center; }
    .btn-play {
      flex: 1; padding: 6px; border: 1px solid var(--accent); border-radius: 4px;
      background: var(--accent); color: #fff; cursor: pointer; font-size: .78rem; font-family: inherit;
    }
    .btn-play:hover { background: var(--accent2); border-color: var(--accent2); }
    .speed-sel { width: 90px; }

    /* ── Stats + Detail ──────────────────────────────────────────────────────── */
    #stats { padding: 8px 14px; font-size: .76rem; color: var(--muted); border-bottom: 1px solid var(--border); flex-shrink: 0; min-height: 30px; }
    #detail { flex: 1; overflow-y: auto; padding: 14px; }
    #detail .placeholder { color: var(--muted); font-style: italic; font-size: .84rem; }
    #detail h2 { font-size: .92rem; font-weight: normal; color: var(--accent); margin-bottom: 8px; }
    .event-row { padding: 5px 0; border-bottom: 1px solid var(--border); font-size: .79rem; }
    .event-row:last-child { border-bottom: none; }
    .event-year { font-weight: bold; color: var(--accent2); display: inline-block; width: 38px; }
    .event-coord { font-size: .7rem; color: #bbb; font-family: monospace; margin-top: 1px; }

    /* ── Map ─────────────────────────────────────────────────────────────────── */
    #map { flex: 1; }

    /* ── Legend ──────────────────────────────────────────────────────────────── */
    #legend {
      position: absolute; bottom: 20px; right: 10px; z-index: 900;
      background: rgba(255,255,255,.93); border: 1px solid var(--border);
      border-radius: 6px; padding: 10px 13px; font-size: .74rem; max-width: 190px;
    }
    #legend h4 { color: var(--accent); font-weight: normal; margin-bottom: 6px; font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; }
    .leg-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; overflow: hidden; }
    .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,.15); }
    #legend-persons { max-height: 140px; overflow-y: auto; }
    #legend-roles { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--border); }

    /* Leaflet override */
    .leaflet-container { font-family: 'Georgia', serif; }
  </style>
</head>
<body>

<!-- ── Site header ──────────────────────────────────────────────────────────── -->
<div id="site-header">

<div id="mode-tabs">

        <div class="range-labels">
          <span id="h-year-from">1400</span>
          <span id="h-window-label">1400 – 1430</span>

        </div>

      <div class="anim-row">

        <div class="leg-row"><svg width="13" height="13" viewBox="0 0 13 13"><circle cx="6.5" cy="6.5" r="5.5" fill="#555" stroke="#fff" stroke-width="1"/></svg> Präsenz</div>
        <div class="leg-row"><svg width="13" height="13" viewBox="0 0 13 13"><polygon points="6.5,12 12,1 1,1" fill="#555" stroke="#fff" stroke-width="1"/></svg> Ende</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// Constants & palette
// ══════════════════════════════════════════════════════════════════════════════
const PALETTE = [
  '#c0392b','#2980b9','#27ae60','#8e44ad','#e67e22',
  '#16a085','#d35400','#2c3e50','#f39c12','#1abc9c',
];
const DIM    = '#c0bab0';
const WINDOW = 30;
const ROLE_LABEL = { start: 'Anfang', present: 'Präsenz', end: 'Ende' };
const ROLE_WEIGHT = { start: 1.2, present: 1.0, end: 1.2 };

// ══════════════════════════════════════════════════════════════════════════════
// Map
// ══════════════════════════════════════════════════════════════════════════════
const map = L.map('map').setView([47.5565, 7.5880], 16);

L.tileLayer.wms('https://wms.geo.bs.ch/', {
  layers: 'HP_Situationsplan_Basel_1862',
  format: 'image/png',
  transparent: true,
  attribution: 'Geodaten Kanton Basel-Stadt',
  maxZoom: 20,
  opacity: 0.85,
}).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap, © CARTO', maxZoom: 20, opacity: 0.3, zIndex: 0,
}).addTo(map);

const dotLayer  = L.layerGroup().addTo(map);
const lineLayer = L.layerGroup().addTo(map);
let   heatLayer = null;

// ══════════════════════════════════════════════════════════════════════════════
// State
// ══════════════════════════════════════════════════════════════════════════════
let allRows      = [];
let personMap    = {};   // id → { name, color, colorIdx, rows[] }
let personIds    = [];
let yearIndex    = {};   // year → [{lat,lng,weight}]
let dataMinYear  = 1400;
let dataMaxYear  = 1700;

// Personensuche state
let selectedIds  = [];   // ordered list, max 10
let sWindowStart = 1400;
let sAnimTimer   = null;

// Heatmap state
let hViewMode    = 'window'; // 'window' | 'cumulative'
let hWindowStart = 1400;
let hAnimTimer   = null;

// Active tab
let activeTab = 'search';

// ══════════════════════════════════════════════════════════════════════════════
// CSV parsing
// ══════════════════════════════════════════════════════════════════════════════
function parseCoord(raw) {
  if (!raw) return null;
  const s = raw.trim();

  // WKT POINT(E N) — Shapely format
  const wkt = s.match(/POINT\s*\(\s*([\d.]+)\s+([\d.]+)\s*\)/i);
  if (wkt) {
    const [lat, lon] = lv95ToWgs84(parseFloat(wkt[1]), parseFloat(wkt[2]));
    if (lat < 45 || lat > 50 || lon < 5 || lon > 11) return null;
    return [lat, lon];
  }

  // Plain numbers: "lat,lon" or LV95 pair
  const parts = s.replace(/[()[\]]/g, '').split(/[,;\s]+/).map(Number).filter(n => !isNaN(n));
  if (parts.length < 2) return null;
  let [a, b] = parts;
  if (a > 2_000_000)      { [a, b] = lv95ToWgs84(a, b); }
  else if (b > 2_000_000) { [b, a] = lv95ToWgs84(b, a); }
  if (a < 45 || a > 50 || b < 5 || b > 11) return null;
  return [a, b];
}

function lv95ToWgs84(E, N) {
  const y = (E - 2_600_000) / 1_000_000;
  const x = (N - 1_200_000) / 1_000_000;
  const lon = 2.6779094 + 4.728982*y + 0.791484*y*x + 0.1306*y*x*x - 0.0436*y*y*y;
  const lat = 16.9023892 + 3.238272*x - 0.270978*y*y - 0.002528*x*x - 0.0447*y*y*x - 0.0140*x*x*x;
  return [lat * 100/36, lon * 100/36];
}

function loadCsv(text) {
  const result = Papa.parse(text, { header: true, skipEmptyLines: true });
  const cols = result.meta.fields || [];

  // Support named columns (canonical) or positional fallback.
  // Skip a leading unnamed pandas index column if present.
  const named = cols.includes('person_id');
  const getId   = named ? r => r['person_id']   : r => r[cols[0]];
  const getName = named ? r => r['name']         : r => r[cols[1]];
  const getCoord= named ? r => r['coordinates']  : r => r[cols[2]];
  const getYear = named ? r => r['year']         : r => r[cols[3]];
  const getRole = named ? r => r['event_role']   : r => r[cols[4]];

  const rows = [];
  for (const r of result.data) {
    const coord = parseCoord(getCoord(r));
    if (!coord) continue;
    const year = parseInt(getYear(r));
    if (isNaN(year)) continue;
    const role = String(getRole(r) || 'present').trim().toLowerCase();
    rows.push({ id: String(getId(r)).trim(), name: String(getName(r)).trim(), coord, year, role });
  }
  if (!rows.length) { alert('Keine gültigen Zeilen gefunden.'); return; }

  allRows = rows;
  buildPersonMap();
  buildYearIndex();
  initSliders();
  renderActive();

  document.getElementById('data-status').textContent = `${rows.length} Ereignisse · ${personIds.length} Personen`;
}

function buildPersonMap() {
  personMap = {}; personIds = [];
  for (const r of allRows) {
    if (!personMap[r.id]) { personMap[r.id] = { name: r.name, color: null, colorIdx: null, rows: [] }; personIds.push(r.id); }
    personMap[r.id].rows.push(r);
  }
  for (const id of personIds) personMap[id].rows.sort((a,b) => a.year - b.year);
  personIds.forEach((id, i) => { personMap[id].colorIdx = i; personMap[id].color = PALETTE[i % PALETTE.length]; });
}

function buildYearIndex() {
  yearIndex = {};
  for (const r of allRows) {
    if (!yearIndex[r.year]) yearIndex[r.year] = [];
    yearIndex[r.year].push([r.coord[0], r.coord[1], ROLE_WEIGHT[r.role] || 1.0]);
  }
  const years = allRows.map(r => r.year);
}

function getHeatPoints(from, to) {
  const pts = [];
  for (let y = from; y <= to; y++) {
    if (yearIndex[y]) pts.push(...yearIndex[y]);
  }
  return pts;
}

// ══════════════════════════════════════════════════════════════════════════════
// Slider initialisation
// ══════════════════════════════════════════════════════════════════════════════
function initSliders() {
  const min = dataMinYear, max = dataMaxYear;
  sWindowStart = min; hWindowStart = min;

  for (const [sid, fid, tid, wid] of [
    ['s-time-slider','s-year-from','s-year-to','s-window-label'],
    ['h-time-slider','h-year-from','h-year-to','h-window-label'],
  ]) {
    const sl = document.getElementById(sid);
    sl.min = min; sl.max = Math.max(min, max - WINDOW); sl.value = min;
    document.getElementById(fid).textContent = min;
    document.getElementById(tid).textContent = max;
  }
  updateSWindowLabel(); updateHWindowLabel();
}

function updateSWindowLabel() {
  document.getElementById('s-window-label').textContent = `${sWindowStart} – ${sWindowStart + WINDOW}`;
}
function updateHWindowLabel() {
  if (hViewMode === 'window') {
    document.getElementById('h-window-label').textContent = `${hWindowStart} – ${hWindowStart + WINDOW}`;
  } else {
    document.getElementById('h-window-label').textContent = `bis ${hWindowStart + WINDOW}`;
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// Tab switching
// ══════════════════════════════════════════════════════════════════════════════
document.querySelectorAll('.mode-tab').forEach(btn => btn.addEventListener('click', () => {
  activeTab = btn.dataset.tab;
  document.querySelectorAll('.mode-tab').forEach(b => b.classList.toggle('active', b === btn));
  document.getElementById('panel-search').style.display  = activeTab === 'search'  ? 'flex' : 'none';
  document.getElementById('panel-heatmap').style.display = activeTab === 'heatmap' ? 'flex' : 'none';
  document.getElementById('legend-roles').style.display  = activeTab === 'search'  ? 'block' : 'none';
  renderActive();
}));

function renderActive() {
  if (activeTab === 'search') renderSearch();
  else renderHeatmap();
}

// ══════════════════════════════════════════════════════════════════════════════
// ── MODE 1: Personensuche ────────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════════════

// ── Search input ──────────────────────────────────────────────────────────────
const searchInput   = document.getElementById('person-search');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q || !personIds.length) { searchResults.classList.remove('open'); return; }
  const matches = personIds.filter(id =>
    personMap[id].name.toLowerCase().includes(q) || id.toLowerCase().includes(q)
  ).slice(0, 12);
  if (!matches.length) { searchResults.classList.remove('open'); return; }

  searchResults.innerHTML = matches.map(id => {
    const p = personMap[id];
    const added = selectedIds.includes(id);
    return `<div class="result-item${added ? ' disabled' : ''}" data-id="${id}">
      ${p.name} <span class="result-id">${id}</span>
      ${added ? '<em style="float:right;font-size:.7rem">hinzugefügt</em>' : ''}
    </div>`;
  }).join('');
  searchResults.classList.add('open');
});

searchResults.addEventListener('click', e => {
  const item = e.target.closest('.result-item');
  if (!item || item.classList.contains('disabled')) return;
  addPerson(item.dataset.id);
  searchInput.value = '';
  searchResults.classList.remove('open');
  searchInput.focus();
});

document.addEventListener('click', e => {
  if (!document.getElementById('search-wrap').contains(e.target)) searchResults.classList.remove('open');
});

function addPerson(id) {
  if (selectedIds.includes(id) || selectedIds.length >= 10) return;
  // Assign a stable color
  const usedColors = selectedIds.map(i => personMap[i].color);
  const freeColor = PALETTE.find(c => !usedColors.includes(c)) || PALETTE[selectedIds.length % PALETTE.length];
  personMap[id].color = freeColor;
  selectedIds.push(id);
  rebuildChips();
  renderSearch();
}

function removePerson(id) {
  selectedIds = selectedIds.filter(i => i !== id);
  rebuildChips();
  renderSearch();
}

function rebuildChips() {
  const chips = document.getElementById('chips');
  const hint  = document.getElementById('chip-hint');
  chips.innerHTML = selectedIds.map(id => {
    const p = personMap[id];
    return `<span class="chip" style="background:${p.color}">
      ${p.name}
      <button class="chip-remove" data-id="${id}" title="Entfernen">×</button>
    </span>`;
  }).join('');
  hint.textContent = selectedIds.length === 0
    ? 'Noch keine Personen gewählt.'
    : selectedIds.length >= 10 ? 'Maximum (10) erreicht.' : '';

  chips.querySelectorAll('.chip-remove').forEach(btn =>
    btn.addEventListener('click', () => removePerson(btn.dataset.id))
  );
  buildSearchLegend();
}

function buildSearchLegend() {
  const el = document.getElementById('legend-persons');
  if (!selectedIds.length) { el.innerHTML = '<em style="color:var(--muted)">—</em>'; return; }
  el.innerHTML = selectedIds.map(id => {
    const p = personMap[id];
    return `<div class="leg-row" style="cursor:pointer" title="${id}" onclick="removePerson('${id}')">
      <span class="leg-dot" style="background:${p.color}"></span>
      <span style="overflow:hidden;text-overflow:ellipsis">${p.name}</span>
    </div>`;
  }).join('');
  document.getElementById('legend-roles').style.display = 'block';
}

// ── Timeline slider (search) ──────────────────────────────────────────────────
document.getElementById('s-time-slider').addEventListener('input', e => {
  sWindowStart = parseInt(e.target.value);
  updateSWindowLabel();
  renderSearch();
});

// ── Animate (search) ─────────────────────────────────────────────────────────
document.getElementById('s-btn-play').addEventListener('click', () => toggleAnim(
  's', document.getElementById('s-btn-play'), document.getElementById('s-time-slider'),
  () => { sWindowStart = parseInt(document.getElementById('s-time-slider').value); updateSWindowLabel(); renderSearch(); }
));

// ── Render search mode ────────────────────────────────────────────────────────
function renderSearch() {
  clearMapLayers();
  if (!selectedIds.length) {
    document.getElementById('stats').textContent = 'Keine Personen gewählt.';
    document.getElementById('detail').innerHTML = '<p class="placeholder">Person über die Suche oben hinzufügen.</p>';
    return;
  }

  const from = sWindowStart, to = sWindowStart + WINDOW;

  for (const id of selectedIds) {
    const p = personMap[id];

    // Ghost line (full trajectory, dimmed)
    if (p.rows.length > 1) {
      L.polyline(p.rows.map(r => r.coord), {
        color: p.color, weight: 1, opacity: 0.18, dashArray: '5 5'
      }).addTo(lineLayer);
    }

    // Window trajectory
    const wRows = p.rows.filter(r => r.year >= from && r.year <= to);
    if (wRows.length > 1) {
      L.polyline(wRows.map(r => r.coord), {
        color: p.color, weight: 3, opacity: 0.85
      }).addTo(lineLayer);
    }

    // Markers (all events, dim out-of-window)
    for (const r of p.rows) {
      const inW = r.year >= from && r.year <= to;
      makeMarker(r, p.color, !inW);
    }
  }

  const total = selectedIds.reduce((s, id) => s + personMap[id].rows.filter(r => r.year >= from && r.year <= to).length, 0);
  document.getElementById('stats').textContent =
    `${selectedIds.length} Person(en) · ${total} Ereignisse im Fenster ${from}–${to}`;

  updateSearchDetail(from, to);
}

function updateSearchDetail(from, to) {
  const el = document.getElementById('detail');
  let html = '';
  for (const id of selectedIds) {
    const p = personMap[id];
    html += `<h2 style="color:${p.color};border-left:3px solid ${p.color};padding-left:6px;margin-bottom:6px">${p.name}</h2>`;
    for (const r of p.rows) {
      const inW = r.year >= from && r.year <= to;
      html += `<div class="event-row" style="${inW ? '' : 'opacity:.4'}">
        <span class="event-year">${r.year}</span> ${ROLE_LABEL[r.role] || r.role}
        <div class="event-coord">${r.coord[0].toFixed(4)}, ${r.coord[1].toFixed(4)}</div>
      </div>`;
    }
    html += '<br>';
  }
  el.innerHTML = html || '<p class="placeholder">Keine Ereignisse.</p>';
}

// ══════════════════════════════════════════════════════════════════════════════
// ── MODE 2: Heatmap ──────────────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════════════

// View toggle (window / cumulative)
document.querySelectorAll('.view-btn').forEach(btn => btn.addEventListener('click', () => {
  hViewMode = btn.dataset.view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b === btn));
  const label = document.getElementById('h-slider-label');
  label.textContent = hViewMode === 'window' ? 'Zeitfenster (30 Jahre)' : 'Kumulativ bis Jahr';
  updateHWindowLabel();
  renderHeatmap();
}));

// Slider
document.getElementById('h-time-slider').addEventListener('input', e => {
  hWindowStart = parseInt(e.target.value);
  updateHWindowLabel();
  renderHeatmap();
});

// Radius / blur
document.getElementById('heat-radius').addEventListener('input', e => {
  document.getElementById('radius-val').textContent = e.target.value;
  if (heatLayer) heatLayer.setOptions({ radius: parseInt(e.target.value) });
});
document.getElementById('heat-blur').addEventListener('input', e => {
  document.getElementById('blur-val').textContent = e.target.value;
  if (heatLayer) heatLayer.setOptions({ blur: parseInt(e.target.value) });
});

// Animate
document.getElementById('h-btn-play').addEventListener('click', () => toggleAnim(
  'h', document.getElementById('h-btn-play'), document.getElementById('h-time-slider'),
  () => { hWindowStart = parseInt(document.getElementById('h-time-slider').value); updateHWindowLabel(); renderHeatmap(); }
));

function renderHeatmap() {
  clearMapLayers();
  if (!allRows.length) {
    document.getElementById('stats').textContent = 'Noch keine Daten geladen.';
    return;
  }

  const from = hViewMode === 'window' ? hWindowStart : dataMinYear;
  const to   = hWindowStart + WINDOW;
  const pts  = getHeatPoints(from, to);

  if (!heatLayer) {
    heatLayer = L.heatLayer(pts, {
      radius: parseInt(document.getElementById('heat-radius').value),
      blur:   parseInt(document.getElementById('heat-blur').value),
      maxZoom: 20,
      gradient: { 0.2: '#1a9641', 0.4: '#a6d96a', 0.6: '#ffffbf', 0.8: '#fdae61', 1.0: '#d7191c' },
    }).addTo(map);
  } else {
    heatLayer.setLatLngs(pts);
  }

  const label = hViewMode === 'window'
    ? `${hWindowStart} – ${hWindowStart + WINDOW}`
    : `${dataMinYear} – ${hWindowStart + WINDOW} (kumulativ)`;
  document.getElementById('stats').textContent = `${pts.length} Ereignisse · ${label}`;
  document.getElementById('detail').innerHTML = `<p class="placeholder" style="line-height:1.7">
    ${pts.length} Ereignisse im Zeitraum <strong>${label}</strong>.<br><br>
    Regler ziehen oder Abspielen drücken um die zeitliche Entwicklung zu verfolgen.
  </p>`;

  // Hide person legend in heatmap mode
  document.getElementById('legend-persons').innerHTML = '<em style="color:var(--muted);font-size:.72rem">Heatmap-Modus</em>';
  document.getElementById('legend-roles').style.display = 'none';
}

// ══════════════════════════════════════════════════════════════════════════════
// Shared helpers
// ══════════════════════════════════════════════════════════════════════════════
function clearMapLayers() {
  dotLayer.clearLayers();
  lineLayer.clearLayers();
  if (heatLayer) { heatLayer.setLatLngs([]); }
}

function makeMarker(r, color, dimmed) {
  const sz = dimmed ? 11 : 15;
  const op = dimmed ? 0.28 : 1;
  const fill = dimmed ? DIM : color;
  const stroke = 'rgba(255,255,255,.85)';
  let shape;
  if (r.role === 'start') {
    shape = `<polygon points="${sz/2},1 ${sz-1},${sz-1} 1,${sz-1}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
  } else if (r.role === 'end') {
    shape = `<polygon points="1,1 ${sz-1},1 ${sz/2},${sz-1}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
  } else {
    const rx = sz/2 - 1;
    shape = `<circle cx="${sz/2}" cy="${sz/2}" r="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="opacity:${op};display:block">${shape}</svg>`;
  const marker = L.marker(r.coord, {
    icon: L.divIcon({ html: svg, className: '', iconSize: [sz,sz], iconAnchor: [sz/2,sz/2], tooltipAnchor: [0,-sz/2] })
  });
  marker.bindTooltip(
    `<strong>${r.name}</strong><br>${r.year} · ${ROLE_LABEL[r.role] || r.role}`,
    { direction: 'top', offset: [0, -6] }
  );
  marker.on('click', () => updateSearchDetail(sWindowStart, sWindowStart + WINDOW));
  marker.addTo(dotLayer);
}

// Shared animate toggle
function toggleAnim(prefix, btn, slider, onTick) {
  const timerKey = prefix === 's' ? 'sAnimTimer' : 'hAnimTimer';
  if (window[timerKey]) {
    clearInterval(window[timerKey]);
    window[timerKey] = null;
    btn.textContent = '▶ Abspielen';
    return;
  }
  if (parseInt(slider.value) >= parseInt(slider.max)) slider.value = slider.min;
  btn.textContent = '⏹ Stopp';
  const speed = parseInt(document.getElementById(prefix + '-speed').value);
  window[timerKey] = setInterval(() => {
    const v = parseInt(slider.value);
    if (v >= parseInt(slider.max)) {
      clearInterval(window[timerKey]); window[timerKey] = null;
      btn.textContent = '▶ Abspielen';
      return;
    }
    slider.value = v + 1;
    onTick();
  }, speed);
}

// Make timer vars accessible on window
window.sAnimTimer = null;
window.hAnimTimer = null;

// Load CSV from repo
(async () => {
  try {
    const res = await fetch('movements.csv');
    if (res.ok) { loadCsv(await res.text()); return; }
  } catch { /* ignore */ }
  document.getElementById('data-status').textContent = 'Fehler: CSV nicht gefunden.';
})();
</script>
